# Grafana Tempo configuration (Phase 2) — single-binary, local storage.
# Sized for a local/demo single node: Tempo receives spans over OTLP (from the
# Collector) and stores them on a local volume. No object storage, no clustering
# — those belong to a scaled deployment, not this project (see the Phase 2
# non-goals in the ADD).
server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
          endpoint: 0.0.0.0:4317
        http:
          endpoint: 0.0.0.0:4318

ingester:
  max_block_duration: 5m

compactor:
  compaction:
    block_retention: 48h   # local demo retention; traces older than this are dropped

storage:
  trace:
    backend: local
    local:
      path: /var/tempo/blocks
    wal:
      path: /var/tempo/wal

usage_report:
  reporting_enabled: false
